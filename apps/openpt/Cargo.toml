[package]
name = "openpt"
description = "OpenPT desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "openpt"

[lints]
workspace = true

[features]
asio = ["openpt-playback/asio"]

[dependencies]
openpt-engine.workspace = true
openpt-ui-egui.workspace = true
openpt-playback.workspace = true
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui.workspace = true
serde_json.workspace = true
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true
openpt-vst3-host.workspace = true

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19.2", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder"] }
