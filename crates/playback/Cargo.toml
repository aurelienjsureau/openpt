[package]
name = "openpt-playback"
description = "OpenPT audio device I/O: realtime playback and recording through the mix engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
openpt-time.workspace = true
openpt-audio-io.workspace = true
openpt-midi.workspace = true
openpt-model.workspace = true
openpt-mix.workspace = true
openpt-dsp.workspace = true
log.workspace = true
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal.workspace = true
midir.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { workspace = true, features = ["wasm-bindgen"] }

[features]
asio = ["cpal/asio"]

[dev-dependencies]
serde_json.workspace = true
openpt-mapped.workspace = true

[lints]
workspace = true
