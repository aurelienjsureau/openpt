[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.6.6"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
openpt-time = { path = "crates/time" }
openpt-audio-io = { path = "crates/audio-io" }
openpt-midi = { path = "crates/midi" }
openpt-video = { path = "crates/video" }
openpt-dsp = { path = "crates/dsp" }
openpt-vst3-host = { path = "crates/vst3-host" }
openpt-au-host = { path = "crates/au-host" }
openpt-model = { path = "crates/model" }
openpt-ptx = { path = "crates/ptx" }
openpt-mix = { path = "crates/mix" }
openpt-engine = { path = "crates/engine" }
openpt-playback = { path = "crates/playback" }
openpt-automation = { path = "crates/automation" }
openpt-ui-egui = { path = "crates/ui-egui" }

thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
rayon = "1"
proptest = "1"

symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "vorbis", "ogg", "wav", "pcm", "aiff", "isomp4", "aac", "alac", "adpcm", "caf", "mkv"] }
rustfft = "6"
zip = { version = "9", default-features = false }
cpal = "0.16"
midir = "0.11"

openpt-ui-kit = { path = "crates/ui-kit", features = ["serde"] }
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
