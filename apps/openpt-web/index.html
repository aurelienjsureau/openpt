<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>OpenPT</title>
  <link data-trunk rel="icon" type="image/png" href="../../assets/app-icon/hicolor/64x64/apps/fr.bourrinaudio.openpt.png" />
  <link data-trunk rel="rust" data-bin="openpt-web" data-wasm-opt="z" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1e1f22; }
    #openpt_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #openpt_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="openpt_canvas"></canvas>
  <script>
    (function () {
      var Orig = window.AudioContext || window.webkitAudioContext;
      if (!Orig) return;
      var ctxs = [];
      function Wrapped(opts) { var c = new Orig(opts); ctxs.push(c); return c; }
      Wrapped.prototype = Orig.prototype;
      window.AudioContext = Wrapped;
      if (window.webkitAudioContext) window.webkitAudioContext = Wrapped;
      function resumeAll() {
        ctxs.forEach(function (c) { if (c.state === 'suspended') { c.resume().catch(function () {}); } });
      }
      ['pointerdown', 'mousedown', 'touchstart', 'keydown'].forEach(function (ev) {
        window.addEventListener(ev, resumeAll, { capture: true });
      });
    })();
  </script>
  <div id="openpt_loading">Loading OpenPT&hellip;</div>
</body>
</html>
